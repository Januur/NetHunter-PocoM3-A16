name: Build NetHunter Kernel - Poco M3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git ccache automake flex lzop bison \
          gperf build-essential zip curl \
          zlib1g-dev g++-multilib libxml2-utils \
          bzip2 libbz2-dev bc libncurses5-dev \
          libssl-dev make python3 binutils \
          lld llvm

    - name: Clone Clang Toolchain
      run: |
        mkdir -p toolchain
        git clone --depth=1 \
        https://github.com/ZyCromerZ/Clang \
        toolchain/clang

    - name: Check Config Files
      run: |
        echo "=== Available Configs ==="
        ls arch/arm64/configs/vendor/

    - name: Setup Kernel Config
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
        export ARCH=arm64
        make \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          O=out \
          vendor/chime_defconfig

    - name: Enable NetHunter and CAN Support
      run: |
        cd out
        # CAN Support
        echo "CONFIG_CAN=y" >> .config
        echo "CONFIG_CAN_RAW=y" >> .config
        echo "CONFIG_CAN_BCM=y" >> .config
        echo "CONFIG_CAN_VCAN=m" >> .config
        echo "CONFIG_CAN_SLCAN=m" >> .config
        echo "CONFIG_CAN_SOCKETCAN=y" >> .config
        # WiFi Monitor Mode
        echo "CONFIG_WIRELESS=y" >> .config
        echo "CONFIG_CFG80211=y" >> .config
        echo "CONFIG_MAC80211=y" >> .config
        echo "CONFIG_MAC80211_MESH=y" >> .config
        # USB Support
        echo "CONFIG_USB_SERIAL=y" >> .config
        echo "CONFIG_USB_SERIAL_GENERIC=y" >> .config
        echo "CONFIG_USB_SERIAL_FTDI_SIO=y" >> .config
        # HID Support
        echo "CONFIG_HID=y" >> .config
        echo "CONFIG_UHID=y" >> .config
        # NetHunter
        echo "CONFIG_NETFILTER=y" >> .config
        echo "CONFIG_IP_NF_TARGET_TTL=y" >> .config
        # Fix config
        make \
          ARCH=arm64 \
          CC=$GITHUB_WORKSPACE/toolchain/clang/bin/clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          LLVM=1 \
          O=. \
          olddefconfig

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
        make \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1 \
          LLVM_IAS=1 \
          O=out \
          -j$(nproc) 2>&1 | tee build.log

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Make Flashable Zip
      run: |
        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3 \
        anykernel
        cp out/arch/arm64/boot/Image.gz \
        anykernel/ 2>/dev/null || \
        cp out/arch/arm64/boot/Image \
        anykernel/
        mkdir -p anykernel/modules
        find out -name "*.ko" -exec \
        cp {} anykernel/modules/ \;
        cd anykernel
        zip -r9 \
        NetHunter-PocoM3-A16-$(date +%Y%m%d).zip \
        * -x .git README.md

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-PocoM3-A16
        path: anykernel/NetHunter-PocoM3-A16-*.zip
